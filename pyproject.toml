[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pc-external-validation"
version = "0.1.0"
description = "Source-frozen external operational validation of Perceptive Closure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "jsonschema>=4.23,<5",
  "pyarrow>=20,<21",
  "PyYAML>=6.0,<7",
]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8",
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pc_external"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "authoritative: validates generated authoritative scientific artifacts",
  "network: requires external network access",
]

[tool.coverage.run]
branch = true
source = ["pc_external"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
